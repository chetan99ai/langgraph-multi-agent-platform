name: Production Multi-Agent Platform Deployment

on:
  push:
    branches:
      - main # Triggers continuous integration checks automatically on main branch updates

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Push Infrastructure
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down the code repository from GitHub
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Authenticate securely with AWS using your GitHub Action Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Download and prepare HashiCorp Terraform binary components
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # 4. Synchronize and apply Terraform definitions
      # Note: We pass your secret variables dynamically via the command line so they remain invisible in logs.
      - name: Terraform Init & Apply
        id: terraform
        run: |
          cd infra
          terraform init
          terraform apply -auto-approve \
            -var="sender_email=${{ secrets.SENDER_EMAIL }}" \
            -var="gmail_app_password=${{ secrets.GMAIL_APP_PASSWORD }}" \
            -var="smtp_server=${{ secrets.SMTP_SERVER }}" \
            -var="smtp_port=${{ secrets.SMTP_PORT }}"

      # 5. Extract ECR URL and Runtime ID from the Terraform outputs we defined earlier
      - name: Fetch Environment Output Parameters
        id: outputs
        run: |
          cd infra
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "runtime_id=$(terraform output -raw agent_runtime_id)" >> $GITHUB_OUTPUT

      # 6. Log the pipeline terminal container engine directly into AWS ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build your Python workspace, apply an immutable Git Commit Tag, and push to AWS
      - name: Containerize Platform & Push to Registry
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: langgraph-multi-agent-platform
          IMAGE_TAG: ${{ github.sha }} # Use unique Git Hash to guarantee no tag collisions
        run: |
          # Build the image from the root Dockerfile configuration context
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "full_image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # 8. Trigger a zero-downtime rolling update via the Native AWS CLI
      - name: Notify Bedrock AgentCore Control Plane
        run: |
          aws bedrock-agentcore-control update-agent-runtime \
            --agent-runtime-id "${{ steps.outputs.outputs.runtime_id }}" \
            --role-arn "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/langgraph-agentcore-platform-role" \
            --agent-resource-role-arn "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/langgraph-agentcore-platform-role" \
            --agent-runtime-artifact "{\"containerConfiguration\": {\"containerUri\": \"${{ env.full_image_uri }}\"}}" \
            --region us-east-1
